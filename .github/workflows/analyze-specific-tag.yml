name: Analyze Specific Tag
on: workflow_dispatch

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          source: 'https://github.com/coderamp-labs/gitingest'
          tag: 'v0.3.1'

      - name: Print summary
        run: cat ${{ steps.digest.outputs.summary-file }}
