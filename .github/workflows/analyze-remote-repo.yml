name: Analyze Remote Repository
on: workflow_dispatch

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # This example analyzes a remote repository without checking it out
      # Useful for: Analyzing repos you don't own, quick analysis without cloning
      # Example: pypi-package-stats - CLI for PyPI package download analytics
      - name: Analyze remote repository
        uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          source: 'https://github.com/ysskrishna/pypi-package-stats'
          branch: 'main'

      - name: Display repository summary
        run: |
          echo "📊 Repository Digest Summary:"
          echo "================================"
          cat ${{ steps.digest.outputs.summary-file }}
