name: Selective Artifact Upload
on: workflow_dispatch

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ysskrishna/gitingest-action@v1
        id: digest

      - name: Print summary
        run: cat ${{ steps.digest.outputs.summary-file }}

      - uses: actions/upload-artifact@v4
        with:
          name: repo-overview
          path: |
            ${{ steps.digest.outputs.summary-file }}
            ${{ steps.digest.outputs.tree-file }}
