name: Monorepo - Analyze Backend Only
on: workflow_dispatch

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          source: 'https://github.com/ysskrishna/fastapi-nextjs-clerk/tree/main/backend'
          include-patterns: |
            *.py
            *.txt
            *.toml
            *.ini
            *.cfg
          exclude-patterns: |
            __pycache__/*
            *.pyc
            .venv/*
            venv/*
          max-file-size: '5242880'

      - name: Print summary
        run: cat ${{ steps.digest.outputs.summary-file }}
