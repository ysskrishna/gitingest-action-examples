name: Monorepo - Analyze Backend Only
on: workflow_dispatch

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # This example analyzes only the backend directory of a monorepo
      # Useful for: Focusing on specific packages, analyzing subdirectories independently
      # Note: Uses tree URL format for remote subdirectories
      - name: Analyze backend subdirectory only
        uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          source: 'https://github.com/ysskrishna/fastapi-nextjs-clerk/tree/main/backend'
          include-patterns: |
            *.py
            *.txt
            *.toml
            *.ini
            *.cfg
          exclude-patterns: |
            **/__pycache__/**
            *.pyc
            **/.venv/**
            **/venv/**
          max-file-size: '5242880'

      - name: Display backend analysis
        run: |
          echo "🗂️  Monorepo Analysis (Backend only - Python files):"
          echo "===================================================="
          echo "📍 Source: fastapi-nextjs-clerk/backend"
          echo "🔍 Max file size: 5MB"
          echo ""
          cat ${{ steps.digest.outputs.summary-file }}
