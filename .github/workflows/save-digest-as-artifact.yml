name: Save Digest as Artifact
on: workflow_dispatch

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # This example saves all digest files as downloadable artifacts
      # Useful for: Archiving analysis, sharing with team, historical snapshots
      # Example: dbconvert - Database conversion CLI/GUI tool
      - name: Generate repository digest
        uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          source: 'https://github.com/ysskrishna/dbconvert'
          output-dir: 'digest'

      - name: Display summary
        run: |
          echo "📦 Repository digest generated in: digest/"
          echo "============================================="
          cat ${{ steps.digest.outputs.summary-file }}

      - name: Upload complete digest as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: repo-digest
          path: digest/

      - name: Artifact info
        run: |
          echo ""
          echo "✅ Artifact uploaded! Includes:"
          echo "   - summary.txt (repository overview)"
          echo "   - tree.txt (directory structure)"
          echo "   - content.txt (full file contents)"
