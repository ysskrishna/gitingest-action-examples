name: Analyze Private Repository
on: workflow_dispatch

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          source: 'https://github.com/ysskrishna/theprovenclub-backend'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print summary
        run: cat ${{ steps.digest.outputs.summary-file }}
