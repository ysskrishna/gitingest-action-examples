name: Analyze Private Repository
on: workflow_dispatch

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # This example analyzes a private repository using authentication
      # Useful for: Analyzing private repos, organization repos with restricted access
      # Note: GITHUB_TOKEN has access to repos in the same org/account by default
      - name: Analyze private repository
        uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          source: 'https://github.com/ysskrishna/theprovenclub-backend'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display private repo analysis
        run: |
          echo "🔒 Private Repository Analysis:"
          echo "================================"
          cat ${{ steps.digest.outputs.summary-file }}
