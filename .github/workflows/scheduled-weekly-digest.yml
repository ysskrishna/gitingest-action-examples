name: Scheduled Weekly Digest
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          output-dir: 'digest'

      - name: Print summary
        run: cat ${{ steps.digest.outputs.summary-file }}

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-digest-${{ github.run_id }}
          path: digest/
