name: Filter Files with Patterns
on: workflow_dispatch

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # This example demonstrates pattern filtering
      # Useful for: Analyzing only specific file types, excluding test/docs folders
      # Example: nestedutils - Python library for nested dict/list access
      - name: Analyze with pattern filters
        uses: ysskrishna/gitingest-action@v1
        id: digest
        with:
          source: 'https://github.com/ysskrishna/nestedutils'
          include-patterns: |
            *.py
            *.md
          exclude-patterns: |
            **/tests/**
            **/docs/**

      - name: Display filtered results
        run: |
          echo "🔍 Filtered Analysis (Python & Markdown files only):"
          echo "===================================================="
          cat ${{ steps.digest.outputs.summary-file }}
